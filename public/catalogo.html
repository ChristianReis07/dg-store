<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daimaoh GeekStore - Catálogo</title>
    <link rel="icon" type="image/png" href="./assets/logos/coin.png" />
    <link href="./output.css" rel="stylesheet" />
  </head>
  <body
    class="bg-zinc-900 text-zinc-100 font-sans antialiased relative scroll-smooth"
  >
    <nav
      class="fixed top-0 w-full z-50 bg-zinc-900/95 backdrop-blur-md border-b border-zinc-800"
    >
      <div
        class="max-w-7xl mx-auto px-6 h-24 flex justify-between items-center"
      >
        <a href="./index.html#inicio" class="flex items-center shrink-0">
          <img
            src="./assets/logos/DG_Logo.png"
            alt="Logo DGStore"
            class="h-24 md:h-28 w-auto object-contain"
          />
        </a>

        <button
          id="mobile-menu-btn"
          class="md:hidden text-zinc-400 hover:text-daimaoh focus:outline-none"
        >
          <svg
            class="w-8 h-8"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>
        </button>

        <div class="hidden md:flex items-center space-x-10 h-full">
          <a
            href="./index.html#inicio"
            class="h-full flex items-center text-sm font-medium text-zinc-400 hover:text-daimaoh relative group transition-colors"
          >
            Início
            <span
              class="absolute bottom-0 left-0 w-full h-0.5 bg-daimaoh scale-x-0 group-hover:scale-x-100 transition-transform origin-left"
            ></span>
          </a>
          <a
            href="./index.html#sobre"
            class="h-full flex items-center text-sm font-medium text-zinc-400 hover:text-daimaoh relative group transition-colors"
          >
            Sobre Nós
            <span
              class="absolute bottom-0 left-0 w-full h-0.5 bg-daimaoh scale-x-0 group-hover:scale-x-100 transition-transform origin-left"
            ></span>
          </a>
          <a
            href="./index.html#galeria"
            class="h-full flex items-center text-sm font-medium text-zinc-400 hover:text-daimaoh relative group transition-colors"
          >
            Serviços
            <span
              class="absolute bottom-0 left-0 w-full h-0.5 bg-daimaoh scale-x-0 group-hover:scale-x-100 transition-transform origin-left"
            ></span>
          </a>
          <a
            href="./catalogo.html"
            class="h-full flex items-center text-sm font-medium text-daimaoh relative group transition-colors"
          >
            Catálogo
            <span
              class="absolute bottom-0 left-0 w-full h-0.5 bg-daimaoh scale-x-100 transition-transform origin-left"
            ></span>
          </a>
          <a
            href="./index.html#contato"
            class="h-full flex items-center text-sm font-medium text-zinc-400 hover:text-daimaoh relative group transition-colors"
          >
            Contato
            <span
              class="absolute bottom-0 left-0 w-full h-0.5 bg-daimaoh scale-x-0 group-hover:scale-x-100 transition-transform origin-left"
            ></span>
          </a>
        </div>
      </div>

      <div
        id="mobile-menu"
        class="hidden md:hidden bg-zinc-900/95 border-t border-zinc-800 absolute top-24 left-0 w-full flex-col px-6 py-4 space-y-4 shadow-lg backdrop-blur-md"
      >
        <a
          href="./index.html#inicio"
          class="block text-zinc-400 hover:text-daimaoh font-medium transition-colors"
          >Início</a
        >
        <a
          href="./index.html#sobre"
          class="block text-zinc-400 hover:text-daimaoh font-medium transition-colors"
          >Sobre Nós</a
        >
        <a
          href="./index.html#galeria"
          class="block text-zinc-400 hover:text-daimaoh font-medium transition-colors"
          >Serviços</a
        >
        <a
          href="./catalogo.html"
          class="block text-daimaoh font-medium transition-colors"
          >Catálogo</a
        >
        <a
          href="./index.html#contato"
          class="block text-zinc-400 hover:text-daimaoh font-medium transition-colors"
          >Contato</a
        >
      </div>
    </nav>

    <main class="pt-32 pb-20 px-6 max-w-7xl mx-auto min-h-screen">
      <h1
        class="text-4xl sm:text-5xl font-extrabold leading-tight mb-8 text-center"
      >
        Nosso
        <span class="text-daimaoh underline decoration-daimaoh/30"
          >Catálogo</span
        >
      </h1>
      <p class="text-zinc-400 text-center mb-12 max-w-2xl mx-auto">
        Encontre os melhores produtos, com a qualidade e cuidado que todo fã
        merece.
      </p>

      <div
        id="status"
        class="py-4 px-6 bg-zinc-800/80 border border-daimaoh/30 text-daimaoh rounded-lg text-center font-medium max-w-xl mx-auto mb-12"
      >
        Aguardando link da planilha...
      </div>

      <div
        id="search-container"
        class="max-w-2xl mx-auto mb-10 hidden flex-col sm:flex-row gap-3"
      >
        <input
          type="text"
          id="search-input"
          placeholder="Buscar produto pelo nome..."
          class="flex-grow bg-zinc-800/80 border border-zinc-700/50 rounded-lg px-5 py-3 text-zinc-100 focus:outline-none focus:border-daimaoh transition-colors placeholder-zinc-500"
        />
        <button
          id="search-btn"
          class="bg-daimaoh text-zinc-900 px-8 py-3 rounded-lg font-bold hover:bg-daimaoh-hover transition-colors shrink-0 flex items-center justify-center gap-2"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            ></path>
          </svg>
          Buscar
        </button>
      </div>

      <div
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
        id="catalog"
      ></div>
    </main>

    <footer
      class="py-10 text-center border-t border-zinc-800 text-zinc-500 text-sm"
    >
      <img
        src="./assets/logos/DG_Logo.png"
        alt="Logo Daimaoh Geek Store"
        class="h-20 w-auto mx-auto mb-4 object-contain"
      />
      &copy; 2026 Daimaoh GeekStore. Todos os direitos reservados.
    </footer>

    <script src="./catalogo.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const mobileMenuBtn = document.getElementById("mobile-menu-btn");
        const mobileMenu = document.getElementById("mobile-menu");

        if (mobileMenuBtn && mobileMenu) {
          mobileMenuBtn.addEventListener("click", () => {
            mobileMenu.classList.toggle("hidden");
            mobileMenu.classList.toggle("flex");
          });
        }
      });
    </script>
  </body>
</html>
